<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Exam Performance Prediction</title>
</head>
<body>
    <main class="login">
        <h1>Student Exam Performance Prediction</h1>
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="" selected disabled>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label for="ethnicity">Race or ethnicity</label>
            <select id="ethnicity" name="ethnicity" required>
                <option value="" selected disabled>Select ethnicity</option>
                {% for group in ["group A", "group B", "group C", "group D", "group E"] %}
                <option value="{{ group }}">{{ group|title }}</option>
                {% endfor %}
            </select>

            <label for="parental_level_of_education">Parental level of education</label>
            <select id="parental_level_of_education" name="parental_level_of_education" required>
                <option value="" selected disabled>Select education</option>
                {% for level in ["associate's degree", "bachelor's degree", "high school", "master's degree", "some college", "some high school"] %}
                <option value="{{ level }}">{{ level|title }}</option>
                {% endfor %}
            </select>

            <label for="lunch">Lunch type</label>
            <select id="lunch" name="lunch" required>
                <option value="" selected disabled>Select lunch type</option>
                <option value="free/reduced">Free/reduced</option>
                <option value="standard">Standard</option>
            </select>

            <label for="test_preparation_course">Test preparation course</label>
            <select id="test_preparation_course" name="test_preparation_course" required>
                <option value="" selected disabled>Select course status</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label for="reading_score">Reading score (0–100)</label>
            <input id="reading_score" name="reading_score" type="number" min="0" max="100" required>

            <label for="writing_score">Writing score (0–100)</label>
            <input id="writing_score" name="writing_score" type="number" min="0" max="100" required>

            <button type="submit">Predict maths score</button>
        </form>

        {% if results is defined %}
        <h2>Predicted maths score: {{ results }}</h2>
        {% endif %}
    </main>
</body>
</html>
